[workspace]
members = [
    "crates/app-core",
    "crates/app-ui",
    "crates/desktop",
]
default-members = ["crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
app-core = { path = "crates/app-core" }
app-ui = { path = "crates/app-ui" }
gpui-kit = { version = "=0.6.4", default-features = false, features = ["component", "assets"] }
toml = { version = "=0.8.23" }
winresource = { version = "=0.1.31" }

# Kit 0.6.4's inspector API requires the 0.3.5 snapshot. This is checked
# against Cargo.lock by check-architecture.ps1; see ADR 0007.
[workspace.metadata.ui-bom]
gpui-pre = "0.3.5"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-windows]
opt-level = 3

[profile.dev.package.gpui-base]
opt-level = 3

[profile.dev.package.gpui-component]
opt-level = 3
