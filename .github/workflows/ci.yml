name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows quality gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Run checks without a desktop
        shell: pwsh
        run: .\scripts\check.ps1 -Group docs,static,tests,build,validators

      - name: Verify generated product fixture
        shell: pwsh
        run: .\scripts\test-generated-project.ps1 -SkipGui
